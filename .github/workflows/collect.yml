name: Collect

# Collects raw snapshots onto the data branch (ADR 007). cron-job.org starts it every 5 minutes
# through workflow_dispatch, because GitHub's own schedule barely ran (ADR 008); the collector
# decides per source whether it is due: the parking feed every run while values change (adaptive
# polling, ADR 003), the parking register hourly (ADR 010).
on:
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  # Push snapshots to the data branch; main stays protected by its ruleset
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check out the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data data
          else
            # First run: the data branch starts with its own history and the NLOD 2.0
            # attribution, before any snapshot is published (#32)
            git worktree add --orphan -b data data
            cp templates/DATA-LICENCE.md data/
            cd data
            git add DATA-LICENCE.md
            git commit -m "data: add NLOD 2.0 attribution"
            git push -u origin data
          fi

      # The attribution covers every source on the branch; keep it in step with the template
      - name: Update the data licence
        run: |
          cp templates/DATA-LICENCE.md data/
          cd data
          git add DATA-LICENCE.md
          git diff --cached --quiet || git commit -m "data: update NLOD 2.0 attribution"

      - name: Collect
        id: collect
        run: |
          set +e
          uv run --no-dev python -m stavanger_parking.bronze.collect run \
            --storage data --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Snapshots from sources that succeeded are kept even if another source failed
      - name: Commit and push snapshots
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to store"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_id }})"
          # A push can fail for a moment; a snapshot that never reaches the branch is lost (#119)
          for attempt in 1 2 3; do
            git push origin data && exit 0
            echo "push failed (attempt $attempt); trying again on top of the remote branch"
            sleep $((attempt * 5))
            git fetch origin data
            git rebase FETCH_HEAD
          done
          exit 1

      - name: Fail the run if a source failed
        if: steps.collect.outputs.status != '0'
        run: exit 1
