name: Collect register

# Collects a snapshot of Stavanger Parkering's areas in the national parking register
# (Parkeringsregisteret), the source of facility capacities, onto the data branch (ADR 005).
# Capacities change rarely: the intended trigger is a monthly cron-job.org job calling
# workflow_dispatch, like Collect (ADR 008). During the case it is started by hand.
on:
  workflow_dispatch:

# Shared with Collect, so the two never push to the data branch at the same time
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check out the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin data:data
          git worktree add data data

      # The attribution covers every source on the branch; keep it in step with the template
      - name: Update the data licence
        run: |
          cp templates/DATA-LICENCE.md data/
          cd data
          git add DATA-LICENCE.md
          git diff --cached --quiet || git commit -m "data: update NLOD 2.0 attribution"

      - name: Collect
        run: |
          uv run --no-dev python -m stavanger_parking.bronze.collect run \
            --storage data --source parkeringsregisteret \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Commit and push the snapshot
        run: |
          cd data
          git add -A
          git diff --cached --quiet || git commit -m "data: register snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_id }})"
          git push origin data
