name: Changelog

on:
  push:
    branches: [main]
    # The changelog commit only touches CHANGELOG.md, so it does not trigger another run
    paths-ignore: [CHANGELOG.md]

concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    # The deploy key lives in this environment, which only main may use
    environment: changelog
    steps:
      # The deploy key is on the main ruleset's bypass list, so this job can push
      # to main while everyone else has to go through a pull request
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md

      # Rebase onto main in case another merge landed while this job ran
      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(changelog): update CHANGELOG.md"
          git pull --rebase origin main
          git push origin HEAD:main
