[project]
name = "stavanger-parking"
version = "0.11.0"
description = "Ingestion, transformation and modelling of Stavanger parking open data (bronze → silver → gold)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "deltalake>=1.6",
    "httpx>=0.28.1",
    "polars>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]
release = [
    "git-cliff>=2.14.2,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
