[project]
name = "stavanger-parking"
version = "0.23.1"
description = "Ingestion, transformation and modelling of Stavanger parking open data (bronze → silver → gold)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "deltalake>=1.6",
    "httpx>=0.28.1",
    "polars>=1.44",
]

# Entry points of the platforms' jobs (Databricks wheel tasks call them by name)
[project.scripts]
stavanger-parking-pipeline = "stavanger_parking.pipeline:entry"
stavanger-parking-collect = "stavanger_parking.bronze.collect:entry"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=9.1",
    "referencing>=0.36",
    "ruff>=0.16",
]
powerbi = [
    "ms-fabric-cli>=1.7,<2",
]
release = [
    "git-cliff>=2.14.2,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
# Fabric notebooks in their Git format: cells with %pip magics, not Python modules (#98)
extend-exclude = ["platforms/fabric/workspace"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
