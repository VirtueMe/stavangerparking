# git-cliff configuration: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file, generated from
Conventional Commit messages on `main`.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Only user-facing types reach the changelog; commits matching no parser below are dropped
filter_commits = true
sort_commits = "newest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_preprocessors = [
  # Link PR numbers added by squash merge, e.g. "(#29)"
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/VirtueMe/stavangerparking/pull/${1}))" },
]
commit_parsers = [
  # Breaking changes are always listed, whatever their type
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = "^(chore|ci|build|test|style|refactor)", skip = true },
]

[bump]
# Versions are derived from the changelog-relevant commits since the last tag (see commit_parsers)
initial_tag = "v0.1.0"
features_always_bump_minor = true
# Below 1.0.0 a breaking change bumps the minor version; from 1.0.0 it bumps the major version
breaking_always_bump_major = false
